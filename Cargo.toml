[workspace]
resolver = "2"
members = [
    "crates/arangodb-tools-core",
    "crates/arangodb-client",
    "crates/arangodb-storage",
    "crates/arangodb-import",
    "crates/arangodb-export",
    "crates/arangodb-dump",
    "crates/arangodb-restore",
    "crates/arangodb-rdf",
    "crates/arangodb-tools-cli",
]

# The Python binding is a `cdylib` built with maturin/PyO3 and needs a Python
# interpreter at build time, so it is intentionally kept out of the default
# `cargo build --workspace` (and CI). Build it from `bindings/python` with
# `maturin develop` / `maturin build`. See bindings/python/README.md.
exclude = ["bindings/python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["Arthur Keen"]
repository = "https://github.com/ArthurKeen/arangodb-data-tools-rs"
homepage = "https://github.com/ArthurKeen/arangodb-data-tools-rs"
readme = "README.md"
keywords = ["arangodb", "database", "import", "export"]
categories = ["database", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Shared dependency versions are declared here and referenced from member
# crates with `dep.workspace = true` as they are introduced per the
# implementation plan.
[workspace.dependencies]
# Internal crates. Both `path` (for in-workspace builds) and `version` (so the
# crates are publishable to crates.io, where the path is dropped) are declared
# here and inherited by members with `dep.workspace = true`.
arangodb-tools-core = { version = "0.1.0", path = "crates/arangodb-tools-core" }
arangodb-client = { version = "0.1.0", path = "crates/arangodb-client" }
arangodb-storage = { version = "0.1.0", path = "crates/arangodb-storage" }
arangodb-import = { version = "0.1.0", path = "crates/arangodb-import" }
arangodb-export = { version = "0.1.0", path = "crates/arangodb-export" }
arangodb-dump = { version = "0.1.0", path = "crates/arangodb-dump" }
arangodb-restore = { version = "0.1.0", path = "crates/arangodb-restore" }
arangodb-rdf = { version = "0.1.0", path = "crates/arangodb-rdf" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", default-features = false }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
async-stream = "0.3"
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "zstd"] }
csv-async = { version = "1", default-features = false, features = ["tokio"] }
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
regex = "1"
