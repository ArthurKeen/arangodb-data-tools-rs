name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: testpassword
        ports:
          - 8529:8529
        options: >-
          --health-cmd "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.password testpassword --javascript.execute-string 'true' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ARANGO_ENDPOINT: "http://127.0.0.1:8529"
      ARANGO_ROOT_PASSWORD: testpassword
      # S3-compatible backend tests target MinIO (started as a step below, since
      # service containers cannot supply MinIO's `server /data` command).
      AWS_ENDPOINT: "http://127.0.0.1:9000"
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      OBJECT_STORE_S3_TEST_BUCKET: arangox-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO and create the test bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          until curl -sf http://127.0.0.1:9000/minio/health/ready >/dev/null; do sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set h http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing h/arangox-test"
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The binding is excluded from the Cargo workspace (it needs a Python
      # interpreter at build time), so it is fmt/clippy/built on its own here.
      - name: rustfmt
        run: cargo fmt --manifest-path bindings/python/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets
      - name: Install maturin
        run: pip install maturin
      - name: Build and install the wheel
        run: pip install .
        working-directory: bindings/python
      - name: Smoke-test the module
        run: |
          python -c "import arangox; print('arangox', arangox.__version__); \
          assert all(hasattr(arangox, f) for f in ('import_file', 'export', 'dump', 'restore'))"
