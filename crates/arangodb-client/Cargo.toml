[package]
name = "arangodb-client"
description = "ArangoDB HTTP client: connection, authentication, TLS, retry, and API helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { path = "../arangodb-tools-core" }
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
serde = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
