[package]
name = "arangodb-export"
description = "Export ArangoDB collections and AQL query results via the cursor API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { workspace = true }
arangodb-client = { workspace = true }
arangodb-storage = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
csv = "1"
sha2 = { workspace = true }

[dev-dependencies]
arangodb-import = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tempfile = "3"
