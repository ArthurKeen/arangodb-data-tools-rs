[package]
name = "arangodb-export"
description = "Export ArangoDB collections and AQL query results via the cursor API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { path = "../arangodb-tools-core" }
arangodb-client = { path = "../arangodb-client" }
arangodb-storage = { path = "../arangodb-storage" }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
csv = "1"
sha2 = { workspace = true }

[dev-dependencies]
arangodb-import = { path = "../arangodb-import" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tempfile = "3"
