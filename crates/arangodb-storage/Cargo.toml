[package]
name = "arangodb-storage"
description = "Pluggable object/file storage abstraction (local FS, S3, GCS, Azure, SeaweedFS) with streaming I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { workspace = true }
async-compression.workspace = true
async-stream.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tempfile = "3"
