[package]
name = "arangodb-storage"
description = "Pluggable object/file storage abstraction (local FS, S3, GCS, Azure, SeaweedFS) with streaming I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { path = "../arangodb-tools-core" }
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tempfile = "3"
