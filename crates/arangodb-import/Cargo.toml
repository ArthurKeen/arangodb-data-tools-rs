[package]
name = "arangodb-import"
description = "Bulk import of CSV, TSV, JSON, and JSONL data into ArangoDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { path = "../arangodb-tools-core" }
arangodb-client = { path = "../arangodb-client" }
arangodb-storage = { path = "../arangodb-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "rt"] }
futures = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
async-compression = { workspace = true }
async-trait = { workspace = true }
csv-async = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "time"] }
