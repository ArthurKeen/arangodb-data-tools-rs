[package]
name = "arangodb-rdf"
description = "Bulk-load RDF data (N-Triples, Turtle, ...) into ArangoDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { path = "../arangodb-tools-core" }
arangodb-client = { path = "../arangodb-client" }
arangodb-import = { path = "../arangodb-import" }
serde_json = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
arangodb-client = { path = "../arangodb-client" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
