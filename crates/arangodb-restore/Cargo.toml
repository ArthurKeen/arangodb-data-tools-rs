[package]
name = "arangodb-restore"
description = "Restore ArangoDB databases from dumps, with dependency-ordered, resumable loading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { workspace = true }
arangodb-client = { workspace = true }
arangodb-storage = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true }

[dev-dependencies]
arangodb-dump = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
