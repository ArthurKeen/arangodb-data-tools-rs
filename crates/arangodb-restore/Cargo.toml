[package]
name = "arangodb-restore"
description = "Restore ArangoDB databases from dumps, with dependency-ordered, resumable loading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
arangodb-tools-core = { path = "../arangodb-tools-core" }
arangodb-client = { path = "../arangodb-client" }
arangodb-storage = { path = "../arangodb-storage" }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true }

[dev-dependencies]
arangodb-dump = { path = "../arangodb-dump" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
