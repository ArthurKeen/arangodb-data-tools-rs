[package]
name = "arangodb-tools-cli"
description = "The arangox command-line tool for ArangoDB import, export, dump, and restore workflows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "arangox"
path = "src/main.rs"

[dependencies]
arangodb-tools-core = { workspace = true }
arangodb-client = { workspace = true }
arangodb-storage = { workspace = true }
arangodb-import = { workspace = true }
arangodb-export = { workspace = true }
arangodb-dump = { workspace = true }
arangodb-restore = { workspace = true }
arangodb-rdf = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-std", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
